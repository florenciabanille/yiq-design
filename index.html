<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>YachtIQ · RBAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#88735E;--p900:#584a3d;--p700:#6f5e4d;--p400:#9f8f7e;--p300:#b5a89b;
  --p200:#c9c0b6;--p150:#d8d2cb;--p100:#e7e3de;--p50:#f3f1ee;--p25:#f9f8f6;
  --p15:rgba(136,115,94,.15);--p10:rgba(136,115,94,.1);
  --g11:#1e1a17;--g39:#6a5f55;--g75:#b8b0a8;--white:#fff;
  --green:#2b9667;--greenl:rgba(43,150,103,.15);
  --red:#d73337;--redl:rgba(215,51,55,.12);
  --amber:#c47b0a;--amberl:rgba(196,123,10,.12);
  --blue:#3b5bdb;--bluel:rgba(59,91,219,.1);
  --f:'DM Sans',sans-serif
}
body{font-family:var(--f);background:var(--p25);color:var(--g11);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}

/* ── APPS ── */
#yiq{display:flex;height:100vh;overflow:hidden}
#by{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#f4f6f9}
.hidden{display:none!important}

/* ── YIQ SIDEBAR ── */
#sb{width:220px;min-width:220px;background:var(--white);border-right:1px solid var(--p150);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;transition:width .2s}
#sb.col{width:56px;min-width:56px}
.sb-hd{padding:18px 14px;border-bottom:1px solid var(--p150);display:flex;align-items:center;justify-content:space-between;min-height:60px;flex-shrink:0}
.logo-y{font-size:14px;font-weight:700;color:var(--g11);letter-spacing:2px}
.logo-iq{font-size:14px;font-weight:300;color:var(--p);letter-spacing:2px}
.sb-tgl{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--g75);display:flex}
.sb-tgl:hover{background:var(--p50)}
.nav-body{flex:1;padding:8px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--g39);transition:background .12s;white-space:nowrap;overflow:hidden}
.ni:hover{background:var(--p50);color:var(--g11)}
.ni.on{background:var(--p100);color:var(--g11);font-weight:500}
.ni svg{flex-shrink:0;opacity:.65}
.ni.on svg,.ni:hover svg{opacity:1}
.nl{flex:1;overflow:hidden;text-overflow:ellipsis}
.nb{margin-left:auto;background:var(--p);color:#fff;font-size:10px;font-weight:600;min-width:17px;height:17px;padding:0 4px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nd{height:1px;background:var(--p150);margin:6px 14px}
.ns{display:flex;align-items:center;gap:9px;padding:8px 12px 8px 36px;margin:1px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--g39);transition:background .12s}
.ns:hover{background:var(--p50);color:var(--g11)}
.ns.on{background:var(--p100);color:var(--g11);font-weight:500}
#sb.col .ni{padding:10px 0;margin:1px 4px;justify-content:center}
#sb.col .nl,#sb.col .nb{display:none}
#sb.col .nd{margin:4px 8px}

/* ── YIQ MAIN ── */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
#tb{height:52px;background:var(--white);border-bottom:1px solid var(--p150);display:flex;align-items:center;padding:0 22px;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:40}
.tb-bc{display:flex;align-items:center;gap:5px;font-size:13px}
.tb-par{color:var(--g75);cursor:pointer}
.tb-par:hover{color:var(--p)}
.tb-pg{color:var(--g11);font-weight:500}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.prod-pill{height:27px;padding:0 10px;border:1px solid var(--p150);border-radius:999px;background:var(--p25);font-size:11px;font-weight:500;color:var(--p700);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--f)}
.av{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.un{font-size:13px;color:var(--g39)}
#pc{flex:1}

/* ── PAGE STRUCTURE ── */
.pg{padding:24px 26px}
.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.pg-t{font-size:23px;font-weight:500;line-height:1.3}
.pg-s{font-size:13px;color:var(--g39);margin-top:3px}
.acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{height:33px;padding:0 13px;border-radius:6px;font-size:13px;font-family:var(--f);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .12s;border:none;line-height:1}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--p700)}.bp:disabled{opacity:.4;cursor:not-allowed}
.bs{background:var(--white);color:var(--g39);border:1px solid var(--p200)}.bs:hover{border-color:var(--p);color:var(--g11)}.bs:disabled{opacity:.4;cursor:not-allowed}
.bg{background:none;color:var(--g39);border:none}.bg:hover{background:var(--p50)}
.bd{background:var(--white);color:var(--red);border:1px solid var(--red)}.bd:hover{background:var(--redl)}
.bsm{height:27px;padding:0 9px;font-size:12px}

/* ── CARD ── */
.card{background:var(--white);border-radius:10px;border:1px solid var(--p150)}
.ch{padding:13px 16px;border-bottom:1px solid var(--p150);display:flex;align-items:center;gap:8px}
.ct{font-size:13.5px;font-weight:500}

/* ── TABLE ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--p150)}
th{padding:8px 14px;font-size:10.5px;font-weight:500;color:var(--g39);text-align:left;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
td{padding:11px 14px;font-size:13px;color:var(--g39);border-bottom:1px solid var(--p150);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fdfaf7}
.tpri{color:var(--g11)}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.t-adm{background:#3d2e20;color:#fff}.t-brk{background:var(--p);color:#fff}
.t-lm{background:var(--p700);color:#fff}.t-ana{background:var(--p100);color:var(--p900)}
.t-sup{background:var(--p50);color:var(--p700)}.t-vw{background:var(--p50);color:var(--g75)}
.t-ok{background:var(--greenl);color:var(--green)}.t-wn{background:var(--amberl);color:var(--amber)}
.t-dg{background:var(--redl);color:var(--red)}.t-nf{background:var(--bluel);color:var(--blue)}
.t-mu{background:var(--p50);color:var(--g75)}
.sc-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid}
.sc-au{background:var(--p25);border-color:var(--p200);color:var(--p700)}
.sc-br{background:var(--p50);border-color:var(--p300);color:var(--p700)}
.sc-xb{background:var(--p100);border-color:var(--p);color:var(--p900)}
.sc-al{background:var(--p);border-color:var(--p700);color:#fff}

/* ── FORM ── */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:10px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--g39);margin-bottom:5px}
.inp{height:35px;border:1px solid var(--p200);border-radius:7px;padding:0 11px;font-size:13px;font-family:var(--f);color:var(--g11);background:#fff;outline:none;width:100%;transition:border-color .12s}
.inp:focus{border-color:var(--p)}.inp::placeholder{color:var(--g75)}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
.sel{height:33px;border:1px solid var(--p200);border-radius:7px;padding:0 9px;font-size:13px;font-family:var(--f);color:var(--g11);background:#fff;outline:none;cursor:pointer}
.sel:focus{border-color:var(--p)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── NOTICE ── */
.notice{padding:9px 13px;border-radius:8px;font-size:13px;display:flex;gap:9px;align-items:flex-start;border:1px solid;line-height:1.5;margin-bottom:13px}
.n-i{background:var(--bluel);border-color:#c7d2fe;color:#1e3a8a}
.n-w{background:var(--amberl);border-color:#fde68a;color:#92400e}
.n-ok{background:var(--greenl);border-color:#a7f3d0;color:var(--green)}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(30,26,23,.38);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.ov.hidden{display:none}
.md{background:#fff;border-radius:12px;width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 16px 56px rgba(136,115,94,.18)}
.md-lg{width:800px}
.md-hd{padding:16px 20px;border-bottom:1px solid var(--p150);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5}
.md-t{font-size:15px;font-weight:500}
.md-x{background:none;border:none;cursor:pointer;color:var(--g75);font-size:17px;padding:3px;line-height:1}
.md-b{padding:20px}
.md-ft{padding:12px 20px;border-top:1px solid var(--p150);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:#fff}

/* ── STEPS ── */
.steps{display:flex;align-items:center;margin-bottom:20px}
.sd{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.st-dn .sd{background:var(--green);color:#fff}
.st-ac .sd{background:var(--p);color:#fff}
.st-td .sd{background:var(--p100);color:var(--g75)}
.sl{font-size:12px;margin-left:5px}
.st-ac .sl{font-weight:500;color:var(--g11)}
.st-dn .sl{color:var(--g39)}
.st-td .sl{color:var(--g75)}
.s-ln{flex:1;max-width:28px;height:1px;background:var(--p200);margin:0 5px}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--p150);margin-bottom:16px}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--g39);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--g11);font-weight:500;border-bottom-color:var(--p)}
.tab:hover:not(.on){color:var(--g11)}

/* ── KPI ── */
.kpi{background:#fff;border:1px solid var(--p150);border-radius:10px;padding:15px 18px}
.kv{font-size:26px;font-weight:700;color:var(--g11);line-height:1}
.kl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--g39);margin-top:4px}

/* ── MISC ── */
.dvd{height:1px;background:var(--p150);margin:12px 0}
.row{display:flex;align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}
.pr{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--p150)}
.pr:last-child{border-bottom:none}
.m-on{background:var(--greenl);color:var(--green)}
.m-off{background:var(--p50);color:var(--g75)}

/* ── PERMISSIONS pills ── */
.ap{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:all .12s;font-size:12px;font-weight:500;user-select:none}
.ap.on{background:var(--p);color:#fff;border:1.5px solid var(--p)}
.ap.off{background:var(--p50);color:var(--g75);border:1.5px solid var(--p150)}
.ap:hover.off{border-color:var(--p300)}
.ap-d{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.ap.on .ap-d{background:rgba(255,255,255,.25);color:#fff}
.ap.off .ap-d{background:var(--p150);color:var(--g75)}

/* ── FIELD pills ── */
.fp{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;cursor:pointer;user-select:none;transition:all .1s}

/* ── EFFECTIVE table ── */
.er{display:grid;grid-template-columns:1fr 120px 120px 86px 76px;padding:12px 14px;cursor:pointer;transition:background .1s;align-items:center}
.er:hover,.er.open{background:var(--p25)}
.ep{border-top:1px solid var(--p100);background:var(--p25);padding:14px 18px 18px}
.ep.hidden{display:none}

/* ── PRODUCT SWITCHER DROPDOWN ── */
#sw-dd{position:absolute;top:42px;right:0;z-index:2000;background:#fff;border:1px solid var(--p150);border-radius:10px;box-shadow:0 8px 24px rgba(30,26,23,.12);width:220px;overflow:hidden;opacity:0;transform:translateY(-6px);transition:opacity .15s,transform .15s;pointer-events:none}
#sw-dd.open{opacity:1;transform:translateY(0);pointer-events:all}
.sw-wrap{position:relative;display:inline-flex}
.sw-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;font-size:13px;color:var(--g11)}
.sw-opt:hover{background:var(--p25)}
.sw-opt.sw-cur{background:var(--p50);pointer-events:none}
.sw-opt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sw-opt-name{flex:1;font-weight:500}
.sw-opt-check{font-size:11px;color:var(--p);margin-left:auto}
.sw-divider{height:1px;background:var(--p150);margin:2px 0}
/* same for Boatyard */
#by-sw-dd{position:absolute;top:42px;right:0;z-index:2000;background:#fff;border:1px solid #e2e6ed;border-radius:10px;box-shadow:0 8px 24px rgba(26,35,50,.12);width:220px;overflow:hidden;opacity:0;transform:translateY(-6px);transition:opacity .15s,transform .15s;pointer-events:none}
#by-sw-dd.open{opacity:1;transform:translateY(0);pointer-events:all}
.by-sw-wrap{position:relative;display:inline-flex}
.by-sw-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;font-size:13px;color:#1a2332}
.by-sw-opt:hover{background:#f4f6f9}
.by-sw-opt.by-sw-cur{background:#e8f4f8;pointer-events:none}
/* ── BOATYARD ── */
/* Boatyard brand colors from reference: dark navy #1a2f45, teal #2d8fa5 */
:root{--by-dark:#1a2f45;--by-teal:#2d8fa5;--by-mid:#4a6580;--by-light:#e8f2f7;--by-border:#dde5ec;}
.by-tnav{height:60px;background:#fff;border-bottom:1px solid var(--by-border);display:flex;align-items:center;padding:0 18px 0 16px;flex-shrink:0;z-index:40;gap:0}
.by-lm{width:44px;height:44px;background:var(--by-teal);border-radius:50%;border:2.5px solid var(--by-dark);display:flex;align-items:center;justify-content:center;margin-right:12px;flex-shrink:0}
.by-lt{display:flex;flex-direction:column;line-height:1.15;margin-right:32px}
.by-l1{font-size:14px;font-weight:700;color:var(--by-dark);letter-spacing:.3px}
.by-l2{font-size:8.5px;font-weight:500;color:var(--by-mid);letter-spacing:1.5px;text-transform:uppercase}
.by-tr{margin-left:auto;display:flex;align-items:center;gap:12px}
.by-pp{height:32px;padding:0 11px;border:1px solid var(--by-border);border-radius:7px;background:#fff;font-size:12px;font-weight:500;color:var(--by-mid);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--f)}
.by-bll{width:36px;height:36px;border-radius:8px;border:1px solid var(--by-border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.by-blb{position:absolute;top:-5px;right:-5px;background:#e53535;color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.by-avb{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:1px solid var(--by-border);background:#fff;cursor:pointer}
.by-av{width:28px;height:28px;border-radius:50%;background:var(--by-teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.by-body{display:flex;flex:1;overflow:hidden}
.by-sb{width:215px;min-width:215px;background:#fff;border-right:1px solid var(--by-border);display:flex;flex-direction:column;overflow-y:auto;padding:14px 0}
.by-si{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;font-size:13.5px;color:var(--by-mid);transition:all .1s;margin:1px 8px;border-radius:7px;font-family:var(--f)}
.by-si:hover{background:var(--by-light);color:var(--by-dark)}
.by-si.on{background:var(--by-light);color:var(--by-teal);font-weight:500}
.by-su{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 33px;cursor:pointer;font-size:13px;color:var(--by-mid);margin:1px 8px;border-radius:7px;transition:all .1s;font-family:var(--f)}
.by-su:hover{background:var(--by-light);color:var(--by-dark)}
.by-su.on{background:var(--by-light);color:var(--by-teal);font-weight:500}
.by-mn{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.by-pg{padding:22px 26px}
.by-pt{font-size:24px;font-weight:600;color:var(--by-dark);line-height:1.2}
.by-ps{font-size:13px;color:var(--by-mid);margin-top:4px;margin-bottom:20px}
.by-btn{height:34px;padding:0 15px;border-radius:6px;font-size:13px;font-family:var(--f);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .12s;border:none}
.by-bp{background:var(--by-teal);color:#fff}.by-bp:hover{background:#155f80}
.by-bs{background:#fff;color:var(--by-mid);border:1px solid var(--by-border)}.by-bs:hover{border-color:var(--by-teal);color:var(--by-dark)}
.by-bsm{height:28px;padding:0 10px;font-size:12px}
.by-card{background:#fff;border-radius:8px;border:1px solid var(--by-border);box-shadow:0 1px 3px rgba(26,35,50,.07)}
.by-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.bta{background:var(--by-dark);color:#fff}.bto{background:#6b4fa0;color:#fff}
.btm{background:var(--by-teal);color:#fff}.bte{background:#2d6a4f;color:#fff}
.btv{background:var(--by-light);color:var(--by-mid);border:1px solid var(--by-border)}
.btok{background:#e6f4ec;color:#1a8a4a}.btwn{background:#fef3e2;color:#b8740a}
.btif{background:#e8f4f8;color:var(--by-teal)}
.by-tbl{width:100%;border-collapse:collapse}
.by-tbl thead tr{border-bottom:2px solid var(--by-border)}
.by-tbl th{padding:9px 14px;font-size:10.5px;font-weight:500;color:var(--by-mid);text-align:left;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.by-tbl td{padding:12px 14px;font-size:13px;color:var(--by-mid);border-bottom:1px solid var(--by-border);vertical-align:middle}
.by-tbl tr:last-child td{border-bottom:none}
.by-tbl tbody tr:hover td{background:var(--by-light)}
.by-av2{width:24px;height:24px;border-radius:50%;background:var(--by-teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.by-tgl{width:38px;height:20px;border-radius:999px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.by-tgl.on{background:var(--by-teal)}.by-tgl.off{background:#d1d9e0}
.by-tgl::after{content:'';width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;top:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.by-tgl.on::after{left:21px}.by-tgl.off::after{left:3px}
.by-ni{padding:10px 13px;border-radius:7px;font-size:13px;display:flex;gap:9px;align-items:flex-start;border:1px solid;line-height:1.5;margin-bottom:14px}
.by-ni-i{background:#e8f4f8;border-color:#b3d9e8;color:#1a4d6b}
.by-kpi{background:#fff;border:1px solid var(--by-border);border-radius:8px;padding:14px 18px}
.by-kv{font-size:26px;font-weight:700;color:var(--by-dark);line-height:1}

/* ══ TYPOGRAPHY SCALE — DM Sans ══
   Display:  700  (logo, KPI numbers only)
   Heading:  600  (page titles, section titles, group headers)
   SemiBold: 500  (emphasized body, table primary, nav active, labels)
   Regular:  400  (body text, descriptions, secondary labels)
   Small:    400  (11-12px supporting text)
   Caps:     600  (10-11px uppercase labels — needs weight for readability at small size)
*/
:root{
  --fw-display:700;
  --fw-heading:600;
  --fw-medium:500;
  --fw-regular:400;
  --fw-caps:600;
}

/* Apply globally */
body{font-weight:var(--fw-regular)}
.pg-t{font-weight:var(--fw-heading)!important}
.ct{font-weight:var(--fw-medium)!important}
.kv{font-weight:var(--fw-heading)!important}
.kl{font-weight:var(--fw-caps)!important}
.tpri{font-weight:var(--fw-medium)!important}
th{font-weight:var(--fw-caps)!important}
.tag{font-weight:var(--fw-caps)!important}
.nb{font-weight:var(--fw-caps)!important}

/* BY specific */
.by-pt{font-weight:var(--fw-heading)!important}
.by-kv{font-weight:var(--fw-heading)!important}
.by-kl{font-weight:var(--fw-caps)!important}
.by-td-primary,.by-tpri{font-weight:var(--fw-medium)!important}
.by-l1{font-weight:var(--fw-display)!important}
.by-l2{font-weight:var(--fw-regular)!important}
.by-tag{font-weight:var(--fw-caps)!important}
.by-mt{font-weight:var(--fw-medium)!important}

/* Ensure font-family on all BY elements */
.by-app,.by-pg,.by-card,.by-tbl,.by-btn,.by-kpi,
.by-si,.by-su,.by-tag,.by-kv,.by-kl{font-family:var(--f)}
</style>

function scopeIco(id,sz=20,c="currentColor"){
  const s=`width:${sz}px;height:${sz}px;display:block`;
  const p=`fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`;
  if(id==="authored") return `<svg style="${s}" viewBox="0 0 22 22" ${p}><path d="M14 3.5L18.5 8 8 18.5 3 19l.5-5z"/><line x1="12" y1="5.5" x2="16.5" y2="10"/></svg>`;
  if(id==="brand")    return `<svg style="${s}" viewBox="0 0 22 22" ${p}><path d="M3 11L11 3l8 8v8h-5v-5H8v5H3z"/></svg>`;
  if(id==="cross-brand") return `<svg style="${s}" viewBox="0 0 22 22" ${p}><circle cx="7" cy="7" r="4"/><circle cx="15" cy="15" r="4"/><path d="M10 7h5M7 10v5"/></svg>`;
  if(id==="all")      return `<svg style="${s}" viewBox="0 0 22 22" ${p}><circle cx="11" cy="11" r="8.5"/><ellipse cx="11" cy="11" rx="4" ry="8.5"/><line x1="2.5" y1="11" x2="19.5" y2="11"/><line x1="5" y1="5.5" x2="17" y2="5.5"/><line x1="5" y1="16.5" x2="17" y2="16.5"/></svg>`;
  return '';
}

/* ════ HELPERS ════ */
function roleTag(n){
  const r=ROLES.find(x=>x.name===n)||{cls:"t-vw",name:n};
  return `<span class="tag ${r.cls}">${r.name||n}</span>`;
}
function scTag(s){
  const m={authored:"sc-au ✍",brand:"sc-br 🏷","cross-brand":"sc-xb ↔",all:"sc-al 🌐"};
  const [cls,lbl]=(m[s]||"sc-au "+s).split(' ');
  return `<span class="sc-chip ${cls}">${lbl} ${s}</span>`;
}
function sDot(s){const c={public:"var(--green)",sensitive:"var(--amber)",confidential:"var(--red)"}[s];return `<span style="width:6px;height:6px;border-radius:50%;background:${c};display:inline-block;flex-shrink:0" title="${s}"></span>`;}
function av(i,sz=30){return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.38)}px;font-weight:500;flex-shrink:0">${i}</div>`;}

/* ════ NAV ════ */
const MN=[
  {id:"dashboard",lb:"Dashboard",     ic:"dashboard"},
  {id:"yachts",   lb:"Yachts",        ic:"yachts"},
  {id:"yachtshow",lb:"Yachts Show",   ic:"yachtshow"},
  {id:"lists",    lb:"Lists & Shows", ic:"lists"},
  {id:"updates",  lb:"Yachts Updates",ic:"updates"},
  {id:"matches",  lb:"Yacht Matches", ic:"matches"},
  {id:"market",   lb:"Market Intelligence",ic:"market"},
  {id:"shipyards",lb:"Shipyards",     ic:"shipyards"},
  {id:"emails",   lb:"Emails",        ic:"emails"},
  {id:"centrals", lb:"Centrals & Deals",ic:"centrals"},
];
const SN=[
  {id:"users", lb:"Team & Users", ic:"users", badge:null},
  {id:"audit", lb:"Audit Log",    ic:"audit", badge:null},
];
const SIDs=new Set(SN.map(n=>n.id));
const PM2={dashboard:"Dashboard",yachts:"Yachts",yachtshow:"Yachts Show",lists:"Lists & Shows",updates:"Yachts Updates",matches:"Yacht Matches",market:"Market Intelligence",shipyards:"Shipyards",emails:"Emails",centrals:"Centrals & Deals",users:"Team & Users",audit:"Audit Log"};
let settOpen=true;

function renderNav(){
  const nb=document.getElementById('nb'); if(!nb) return;
  const col=S.sbCol; const pg=S.page; const inS=SIDs.has(pg);
  let h='';
  MN.forEach(it=>{
    const on=pg===it.id;
    const c=on?'var(--g11)':'var(--g39)';
    h+=`<div class="ni${on?' on':''}" onclick="navTo('${it.id}')" title="${col?it.lb:''}">
      ${ico(it.ic,17,c)}<span class="nl">${it.lb}</span>
    </div>`;
  });
  h+='<div class="nd"></div>';
  const sc=inS?'var(--g11)':'var(--g39)';
  const cr=settOpen?'rotate(0)':'rotate(-90deg)';
  h+=`<div class="ni${inS?' on':''}" onclick="toggleSett()" style="${!col?'justify-content:space-between':''}">
    <div style="display:flex;align-items:center;gap:10px">${ico('settings',17,sc)}<span class="nl">Settings</span></div>
    <div class="nl" style="transform:${cr};transition:transform .2s;display:flex;flex-shrink:0">${ico('chev',11,'var(--g75)')}</div>
  </div>`;
  if(settOpen&&!col) SN.forEach(it=>{
    const on=pg===it.id; const c=on?'var(--p)':'var(--g75)';
    h+=`<div class="ns${on?' on':''}" onclick="navTo('${it.id}')">
      ${ico(it.ic,14,c)}<span style="flex:1">${it.lb}</span>
      ${it.badge?`<span class="nb">${it.badge}</span>`:''}
    </div>`;
  });
  nb.innerHTML=h;
}
function toggleSett(){settOpen=!settOpen;renderNav();}
function navTo(id){S.page=id;updateBC();renderNav();renderPage();}
function updateBC(){
  const inS=SIDs.has(S.page);
  document.getElementById('bc').innerHTML=inS
    ?`<span class="tb-par" onclick="navTo('users')">Settings</span><span style="color:var(--g75)">›</span><span class="tb-pg">${PM2[S.page]||S.page}</span>`
    :`<span class="tb-pg">${PM2[S.page]||S.page}</span>`;
}
function sbToggle(){
  S.sbCol=!S.sbCol;
  const sb=document.getElementById('sb');
  const lf=document.getElementById('logo-f');
  const lm=document.getElementById('logo-m');
  const ic=document.getElementById('sb-ic');
  sb.classList.toggle('col',S.sbCol);
  lf.style.display=S.sbCol?'none':'flex';
  lm.style.display=S.sbCol?'block':'none';
  ic.outerHTML=`<svg id="sb-ic" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">${S.sbCol?'<polyline points="7,4 11,8 7,12"/>':'<polyline points="11,4 7,8 11,12"/>'}</svg>`;
  renderNav();
}

/* ════ PRODUCT SWITCH — dropdown ════ */
function swToggle(e){
  e.stopPropagation();
  const dd=document.getElementById('sw-dd');
  dd.classList.toggle('open');
}
function swClose(){
  const dd=document.getElementById('sw-dd');
  if(dd) dd.classList.remove('open');
}
function bySwToggle(e){
  e.stopPropagation();
  const dd=document.getElementById('by-sw-dd');
  dd.classList.toggle('open');
}
function bySwClose(){
  const dd=document.getElementById('by-sw-dd');
  if(dd) dd.classList.remove('open');
}
function swPick(p){
  S.prod=p;
  document.getElementById('yiq').classList.toggle('hidden',p!=='yiq');
  document.getElementById('by').classList.toggle('hidden',p!=='by');
  swClose(); bySwClose();
  if(p==='by'){renderBySB();renderByPage();}
  updateSwLabels();
}
function updateSwLabels(){
  // Update the check marks / current indicators in both dropdowns
  const yiqDD=document.getElementById('sw-dd');
  const byDD=document.getElementById('by-sw-dd');
  if(!yiqDD||!byDD) return;
  // YIQ dropdown: first option = yiq, second = by
  const opts=yiqDD.querySelectorAll('.sw-opt');
  opts.forEach((o,i)=>{
    const isP=(i===0&&S.prod==='yiq')||(i===1&&S.prod==='by');
    o.classList.toggle('sw-cur',isP);
    const chk=o.querySelector('.sw-opt-check');
    if(isP&&!chk) o.insertAdjacentHTML('beforeend','<span class="sw-opt-check">✓</span>');
    else if(!isP&&chk) chk.remove();
  });
}
// Close dropdowns on outside click
document.addEventListener('click',function(){swClose();bySwClose();});


/* ════ YIQ PAGES ════ */
function renderPage(){
  const el=document.getElementById('pc'); if(!el) return;
  if(!SIDs.has(S.page)){el.innerHTML='';return;}
  const pages={
    users:renderUsers,
    audit:renderAudit,
  };
  el.innerHTML=(pages[S.page]||(()=>''))();
}

/* ── USERS ── */
function renderUsers(){
  const statusFilter=S.usersFilter||'all';
  const PENDING=[
    {id:91,name:"Sarah Mitchell",  email:"s.mitchell@njc.com",    av:"SM",role:"Broker",        scope:"brand",       brand:"N&J",            status:"pending",last:"Invited 2d ago",invExpires:"1d left"},
    {id:92,name:"Tom Keller",      email:"t.keller@burgess.com",  av:"TK",role:"Viewer",         scope:"brand",       brand:"Burgess Yachts", status:"pending",last:"Invited 4d ago",invExpires:"2d left"},
    {id:93,name:"Maria Santos",    email:"m.santos@yiq.com",      av:"MS",role:"Admin",          scope:"all",         brand:"All Brands",     status:"pending",last:"Invited 1d ago",invExpires:"2d left"},
  ];
  const allUsers=[...USERS,...PENDING];
  const filtered=statusFilter==='all'?allUsers
    :statusFilter==='active'?allUsers.filter(u=>u.status==='active')
    :allUsers.filter(u=>u.status==='pending');

  const SCOPE_LABELS={authored:'Authored',brand:'Brand','cross-brand':'Cross-Brand',all:'Global'};

  const rows=filtered.map(u=>`<tr onclick="openUModal(${u.id})" style="cursor:pointer">
    <td>

        ${av(u.av,32)}
        <div>
          <div style="font-size:13px;font-weight:400;color:var(--g11)">${u.name}</div>
          <div style="font-size:11px;color:var(--g75)">${u.email}</div>
        </div>
      </div>
    </td>
    <td style="font-size:13px;color:var(--g39)">${u.brand}</td>
    <td>${roleTag(u.role)}</td>
    <td>
      <span style="font-size:12px;padding:2px 8px;border-radius:999px;background:var(--p50);color:var(--p700);font-weight:500">${SCOPE_LABELS[u.scope]||u.scope}</span>
    </td>
    <td>
      <span class="tag ${u.status==='active'?'t-ok':'t-wn'}">${u.status}</span>
      ${u.invExpires?`<div style="font-size:10px;color:var(--g75);margin-top:1px">${u.invExpires}</div>`:''}
    </td>
    <td>
      ${u.status==='pending'
        ?`<div style="display:flex;gap:5px">
            <button class="btn bg bsm" onclick="event.stopPropagation()">Resend</button>
            <button class="btn bd bsm" onclick="event.stopPropagation()">Revoke</button>
          </div>`
        :`<button class="btn bs bsm" onclick="event.stopPropagation();openUModal(${u.id})">Edit</button>`
      }
    </td>
  </tr>`).join('');

  const tabs=[
    {id:'all',    lb:'All',    n:allUsers.length},
    {id:'active', lb:'Active', n:USERS.filter(u=>u.status==='active').length},
    {id:'pending',lb:'Pending',n:PENDING.length},
  ];
  const tabBar=tabs.map(t=>`<div onclick="S.usersFilter='${t.id}';renderPage()"
    style="padding:9px 16px;font-size:13px;cursor:pointer;white-space:nowrap;
      color:${statusFilter===t.id?'var(--g11)':'var(--g75)'};
      font-weight:${statusFilter===t.id?500:400};
      border-bottom:2px solid ${statusFilter===t.id?'var(--p)':'transparent'};
      margin-bottom:-2px;display:flex;align-items:center;gap:6px">
    ${t.lb}
    <span style="font-size:10px;padding:1px 6px;border-radius:999px;
      background:${statusFilter===t.id?'var(--p)':'var(--p50)'};
      color:${statusFilter===t.id?'white':'var(--g75)'};font-weight:500">${t.n}</span>
  </div>`).join('');

  return `<div class="pg">
    <div class="pg-hd">
      <div>
        <div class="pg-t">Team & Users</div>
        <div class="pg-s">View and manage who has access to YachtIQ</div>
      </div>
      <button class="btn bp" onclick="openInvite()">+ Invite User</button>
    </div>

    <!-- KPIs -->
    <div class="g3" style="margin-bottom:20px">
      ${[["Total",allUsers.length],["Active",USERS.filter(u=>u.status==='active').length],["Pending",PENDING.length]]
        .map(([l,n])=>`<div class="kpi"><div class="kv">${n}</div><div class="kl">${l}</div></div>`).join('')}
    </div>

    <!-- Table -->
    <div class="card" style="overflow:hidden;padding:0">
      <!-- Toolbar -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid var(--p150)">
        <div style="display:flex">${tabBar}</div>
        <div style="display:flex;gap:8px;padding:10px 0">
          <input class="inp" style="width:200px;height:32px" placeholder="Search…"
            oninput="this.closest('.card').querySelectorAll('tbody tr').forEach(r=>
              r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"/>
          <select class="sel" style="height:32px"
            onchange="this.closest('.card').querySelectorAll('tbody tr').forEach(r=>
              r.style.display=(!this.value||r.cells[2]?.textContent.trim()===this.value)?'':'none')">
            <option value="">All Roles</option>
            ${ROLES.map(r=>`<option value="${r.name}">${r.name}</option>`).join('')}

      <!-- Users table -->

          <th>Status</th>

        <tbody>${rows}</tbody>

    </div>
  </div>`;

    <div class="pg-hd"><div><div class="pg-t">Pending Invites</div><div class="pg-s">3 invitations awaiting acceptance</div></div><button class="btn bp" onclick="openInvite()">+ Invite User</button></div>
    <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table>
      <thead><tr><th>Invitee</th><th>Role</th><th>Brand</th><th>Sent</th><th>Expires</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
  </div>`;
}

/* ── ROLES ── */
/* ── ROLES — overview + role-detail (Improvement 1) ── */
function renderRoles(){
  const v=S.rolesView;
  if(S.roleDetailSel && v==='detail') return renderRoleDetail();

  let body='';
  if(v==='cards'){
    body=`<div class="g3">${ROLES.map(r=>`
      <div class="card" style="cursor:pointer" onclick="S.roleDetailSel='${r.name}';S.rolesView='detail';renderPage()">
        <div class="ch" style="justify-content:space-between">${roleTag(r.name)}<span style="font-size:12px;color:var(--g75)">${r.users} users</span></div>
        <div class="card-body" style="padding:12px 16px">
          <div style="font-size:13px;color:var(--g39);line-height:1.6;margin-bottom:10px">${r.desc}</div>
          <div class="dvd" style="margin-bottom:9px"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">${_rolePermSummary(r.name)}</div>
          <div style="margin-top:10px;font-size:11px;color:var(--p);font-weight:500">Configure role →</div>
        </div>
      </div>`).join('')}
    </div>`;
  } else {
    const cols=["Viewer","Broker","Listing Manager","Analyst","Admin"];
    let rows='';
    ENTITIES.forEach(en=>{
      rows+=`<tr><td colspan="${cols.length+1}" style="padding:7px 14px;background:var(--p50);border-top:1px solid var(--p150);border-bottom:1px solid var(--p150)">
        <span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--g39)">${en.label}</span>
        <span style="font-size:11px;color:var(--g75);margin-left:6px">${en.desc}</span>
      </td></tr>`;
      ACTIONS.forEach(a=>{
        const anyHas=cols.some(r=>!!((PM[r]||{})[en.label]||{})[a]);
        if(!anyHas) return;
        rows+=`<tr style="border-bottom:1px solid var(--p150)"><td style="padding:7px 14px 7px 22px;font-size:13px;color:var(--g39)">${a}</td>
        ${cols.map(r=>{
          const has=!!((PM[r]||{})[en.label]||{})[a];
          return `<td style="padding:7px 14px;text-align:center;border-left:1px solid var(--p150)">
            <span style="display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-size:10px;font-weight:700" class="${has?'m-on':'m-off'}">${has?'✓':'–'}</span>
          </td>`;
        }).join('')}
        </tr>`;
      });
    });
    body=`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%">
      <thead><tr>
        <th style="padding:10px 14px;background:var(--p25);border-bottom:2px solid var(--p150);text-align:left;font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--g39)">ENTITY / ACTION</th>
        ${cols.map(r=>`<th style="padding:10px 14px;text-align:center;background:var(--p25);border-bottom:2px solid var(--p150);border-left:1px solid var(--p150);cursor:pointer;white-space:nowrap" onclick="S.roleDetailSel='${r}';S.rolesView='detail';renderPage()">${roleTag(r)}<div style="font-size:9px;color:var(--g75);font-weight:400;margin-top:2px">click to configure</div></th>`).join('')}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }
  return `<div class="pg">
    <div class="pg-hd">
      <div><div class="pg-t">Roles & Permissions</div><div class="pg-s">Select a role to configure its permissions, scope, and field access in one place</div></div>
      <div class="acts">
        <button class="btn ${v==='cards'?'bp':'bs'}" onclick="S.rolesView='cards';renderPage()">≡ Cards</button>
        <button class="btn ${v==='matrix'?'bp':'bs'}" onclick="S.rolesView='matrix';renderPage()">⊞ Matrix</button>
        <button class="btn bs" onclick="S.compareOpen=true;renderPage()">⇄ Compare</button>
        <button class="btn bp" onclick="openRoleCreate()">+ New Role</button>
      </div>
    </div>
    ${body}
    ${S.compareOpen ? renderComparePanel() : ''}
  </div>`;
}

function _rolePermSummary(roleName){
  const perms=PM[roleName]||{};
  let allowed=0,denied=0;
  ENTITIES.forEach(en=>{ ACTIONS.forEach(a=>{ if((perms[en.label]||{})[a]) allowed++; else denied++; }); });
  const fields=FD[roleName]||{};
  const hidden=Object.values(fields).filter(v=>v==='hidden').length;
  return `<span style="font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--greenl);color:var(--green);font-weight:500">${allowed} allowed</span>
    <span style="font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--p50);color:var(--g75);font-weight:500">${denied} denied</span>
    <span style="font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--amberl);color:var(--amber);font-weight:500">${hidden} fields hidden</span>`;
}

/* ── ROLE DETAIL — unified role configuration (Improvement 1 core) ── */
function renderRoleDetail(){
  const role=S.roleDetailSel;
  const tab=S.roleDetailTab;
  const rObj=ROLES.find(r=>r.name===role)||ROLES[0];

  // Sidebar: all roles listed for quick switching
  const sidebar=ROLES.map(r=>`
    <div onclick="S.roleDetailSel='${r.name}';S.roleDetailTab='permissions';renderPage()" style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;background:${r.name===role?'var(--p25)':'transparent'};border:1px solid ${r.name===role?'var(--p150)':'transparent'};transition:all .12s">
      <span class="tag ${r.cls}">${r.name}</span>
      <span style="flex:1;font-size:11px;color:var(--g75)">${r.users} users</span>

  const tabs=[
    {id:'permissions', label:'Permissions',      icon:'permissions'},
    {id:'scope',       label:'Data Scope',        icon:'scopes'},

  return `<div class="pg" style="padding-top:16px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <button class="btn bs bsm" onclick="S.rolesView='cards';renderPage()">← All Roles</button>
      <span style="color:var(--g75);font-size:13px">›</span>
      ${roleTag(role)}
      <span style="font-size:13px;color:var(--g75)">${rObj.users} users</span>
      <div style="flex:1"></div>
      <button class="btn bs bsm" onclick="S.compareOpen=true;renderPage()">⇄ Compare</button>
      <button class="btn bp bsm" onclick="openRoleCreate()">Edit Role</button>
    </div>

    <div style="display:flex;gap:20px;align-items:flex-start">
      <!-- Role switcher sidebar -->
      <div style="width:180px;flex-shrink:0">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g75);margin-bottom:8px;padding-left:4px">All Roles</div>
        ${sidebar}
      </div>

      <!-- Main detail area -->
      <div style="flex:1;min-width:0">
        <!-- Role summary bar -->
        <div class="card" style="padding:14px 18px;margin-bottom:14px;background:var(--p25);border-color:var(--p150)">
          <div style="font-size:12.5px;color:var(--g39);line-height:1.6;margin-bottom:12px">${rObj.desc}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">${_rolePermSummary(role)}</div>
        </div>

        <!-- Tabs -->
        <div class="tabs" style="margin-bottom:0;border-bottom:2px solid var(--p150)">
          ${tabs.map(t=>`<div class="tab${tab===t.id?' on':''}" onclick="S.roleDetailTab='${t.id}';renderPage()" style="display:flex;align-items:center;gap:6px">

          </div>`).join('')}

/* Tab: Permissions */
function _rdPermissions(role){
  const ov=S.permOv;
  const base=PM[role]||{};
  function getV(el,a){const k=el+':'+a;return ov[k]!==undefined?ov[k]:!!(base[el]&&base[el][a]);}
  const hasChg=Object.keys(ov).length>0;

  const cards=ENTITIES.map(en=>{
    const hasAny=ACTIONS.some(a=>getV(en.label,a));
    const pills=ACTIONS.map(a=>{
      const on=getV(en.label,a);
      const changed=ov[en.label+':'+a]!==undefined;
      return `<div class="ap ${on?'on':'off'}" onclick="togglePerm('${en.label}','${a}')" style="${changed?'outline:2px solid var(--p300);outline-offset:2px':''}">
        ${a}<div class="ap-d">${on?'✓':'–'}</div>
      </div>`;
    }).join('');
    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:7px">
      <div class="ch" style="justify-content:space-between;background:${hasAny?'var(--p25)':'var(--p50)'}">
        <div style="display:flex;align-items:center;gap:10px">
          <button style="width:34px;height:19px;border-radius:999px;border:none;cursor:pointer;position:relative;flex-shrink:0;background:${hasAny?'var(--p)':'var(--p200)'};transition:background .2s">
            <span style="width:13px;height:13px;background:#fff;border-radius:50%;position:absolute;top:3px;left:${hasAny?18:3}px;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)"></span>
          </button>
          <div><div class="ct">${en.label}</div><div style="font-size:11px;color:var(--g39);margin-top:1px">${en.desc}</div></div>
        </div>
        ${hasAny?`<div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:11px;color:var(--g39)">Scope restriction:</span>
          <select class="sel" style="height:25px;font-size:11px"><option>Follows user's scope</option><option>Brand only</option><option>Authored only</option></select>
        </div>`:''}
      </div>
      ${hasAny?`<div style="padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap">${pills}</div>`:''}
    </div>`;
  }).join('');

  return `<div>
    ${hasChg?`<div class="notice n-w" style="margin-bottom:12px">${ico('impact',13,'var(--amber)')}<span>${Object.keys(ov).length} unsaved changes — <button class="btn bg bsm" onclick="S.permOv={};renderPage()">Discard</button> <button class="btn bp bsm">Save Changes</button></span></div>`:''}
    <div class="notice n-i" style="margin-bottom:12px">${ico('info',13,'#1e3a8a')}<span>Permissions define <em>what actions are possible</em>. Set Data Scope in the next tab to control <em>which records</em> those actions apply to.</span></div>
    ${cards}
  </div>`;
}

/* Tab: Data Scope — with rich visual explanation (Improvement 2) */
function _rdScope(role){
  // Default scope per role
  const roleScopes={Admin:'all',Broker:'brand','Listing Manager':'brand',Analyst:'cross-brand','Support Agent':'brand',Viewer:'authored'};
  const defaultScope=roleScopes[role]||'brand';

  const SCOPES=[
    {id:'authored',   lb:'Authored Only', risk:'Low',    rc:'t-ok',
     hl:'User sees only records they personally created or were assigned to.',
     can:[{b:'Fraser Yachts',items:['Listings I created','Notes I authored','Shows I organized']},],
     cannot:[{b:'Fraser Yachts',items:["Other brokers' listings","Team notes","Company-wide shows"]},{b:'Burgess Yachts',items:['All records']},{b:'OceanCo',items:['All records']}],
     example:'Elena (Viewer, Authored) can edit the yacht notes she wrote last week, but cannot see notes her colleague Penelope added to the same listing.'},
    {id:'brand',      lb:'Brand-Scoped',  risk:'Medium', rc:'t-wn',
     hl:'User sees all records within their assigned brokerage — across all brokers in that brand.',
     can:[{b:'Fraser Yachts',items:['All yacht listings','All broker notes','Yacht shows','Emails','Sales history']},],
     cannot:[{b:'Burgess Yachts',items:['All records']},{b:'OceanCo',items:['All records']},{b:'N&J',items:['All records']}],
     example:'Penelope (Broker, Fraser) can see every Fraser Yachts listing — including listings from other Fraser brokers. She cannot see any Burgess or OceanCo records, even in shared shows.'},
    {id:'cross-brand',lb:'Cross-Brand',   risk:'High',   rc:'t-dg',
     hl:'User sees records across a defined set of brands. Configured per-user.',
     can:[{b:'Fraser Yachts',items:['All yacht listings','All notes','Sales history']},{b:'Burgess Yachts',items:['All yacht listings','All notes','Sales history']}],
     cannot:[{b:'OceanCo',items:['All records']},{b:'N&J',items:['All records']},{b:'Y.CO',items:['All records']}],
     example:"Akachi (Analyst, Cross-Brand) is assigned Fraser + Burgess. She can run market intelligence reports across both brokerages, but cannot see OceanCo or N&J data even if it's in the same search results."},
    {id:'all',        lb:'All Data',      risk:'Critical',rc:'t-dg',
     hl:'No brand boundaries. User sees every record across all brokerages on the platform.',
     can:[{b:'All Brokerages',items:['Fraser Yachts — all data','Burgess Yachts — all data','OceanCo — all data','N&J — all data','Y.CO — all data','System settings & audit logs']}],
     cannot:[],
     example:'Ricardo (Admin, All Data) can view and manage every listing, deal, note and user across all 6 brokerages. Reserve for Admin roles only.'},
  ];

  const activeId=S.scopeActive||defaultScope;
  const sel=SCOPES.find(s=>s.id===activeId)||SCOPES[1];

  const scopeCards=SCOPES.map(s=>{
    const on=s.id===activeId;
    const isDefault=s.id===defaultScope;
    return `<div onclick="S.scopeActive='${s.id}';renderPage()" style="padding:12px 14px;border-radius:8px;border:1.5px solid ${on?'var(--p)':'var(--p150)'};background:${on?'var(--p25)':'#fff'};cursor:pointer;transition:all .14s;display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:7px;background:${on?'var(--p15)':'var(--p50)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${scopeIco(s.id,16,on?'var(--p)':'var(--g75)')}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:${on?'var(--g11)':'var(--g39)'}">${s.lb}</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          <span class="tag ${s.rc}" style="font-size:10px">${s.risk}</span>
          ${isDefault?`<span style="font-size:10px;color:var(--p);font-weight:500">Default for ${role}</span>`:''}
        </div>
      </div>
      ${on?`<div style="width:8px;height:8px;border-radius:50%;background:var(--p);flex-shrink:0"></div>`:''}
    </div>`;
  }).join('');

  // Access visualisation
  const canRows=sel.can.map(b=>`
    <div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:700;color:var(--g39);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px">
        ${ico('check',12,'var(--green)')} ${b.b}
      </div>
      ${b.items.map(it=>`<div style="font-size:12.5px;color:var(--g11);padding:3px 0 3px 18px;border-left:2px solid var(--greenl);margin-left:5px;margin-bottom:2px">${it}</div>`).join('')}
    </div>`).join('');

  const cannotRows=sel.cannot.map(b=>`
    <div style="margin-bottom:10px;opacity:.7">
      <div style="font-size:11px;font-weight:700;color:var(--g75);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px">
        ${ico('x',12,'var(--red)')} ${b.b}
      </div>
      ${b.items.map(it=>`<div style="font-size:12.5px;color:var(--g75);padding:3px 0 3px 18px;border-left:2px solid var(--redl);margin-left:5px;margin-bottom:2px;text-decoration:line-through">${it}</div>`).join('')}
    </div>`).join('');

  return `<div class="g2" style="gap:18px">
    <div>
      <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g75);margin-bottom:10px">Scope Level</div>
      <div style="display:flex;flex-direction:column;gap:6px">${scopeCards}</div>
      <div style="margin-top:12px;padding:11px 13px;background:var(--p50);border-radius:8px;border-left:3px solid var(--p)">
        <div style="font-size:11.5px;color:var(--g39);line-height:1.6;font-style:italic">"${sel.example}"</div>
      </div>
    </div>
    <div>
      <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g75);margin-bottom:10px">Access Breakdown — ${sel.lb}</div>
      <div style="font-size:13px;color:var(--g39);line-height:1.6;margin-bottom:14px">${sel.hl}</div>
      <div class="g2" style="gap:12px">
        <div class="card" style="padding:14px;border-color:var(--greenl)">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:5px">${ico('check',12,'var(--green)')} Can Access</div>
          ${canRows||'<div style="font-size:12px;color:var(--g75)">No restrictions</div>'}
        </div>
        <div class="card" style="padding:14px;border-color:var(--redl)">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:5px">${ico('x',12,'var(--red)')} Cannot Access</div>
          ${cannotRows||`<div style="font-size:12px;color:var(--g75)">No restrictions — full platform access</div>`}
        </div>
      </div>
    </div>
  </div>`;
}

/* Tab: Field Visibility */
function _rdFields(role){
  const fp=S.fieldFp && S.fieldRole===role ? S.fieldFp : FD[role]||FD['Viewer'];
  // Sync field role state to current role detail
  if(S.fieldRole!==role){ S.fieldRole=role; S.fieldFp={...FD[role]}; }

  const hidden=YF.filter(f=>(fp[f.name]||'hidden')==='hidden').length;
  const viewOnly=YF.filter(f=>(fp[f.name]||'hidden')==='view').length;
  const editable=YF.filter(f=>(fp[f.name]||'hidden')==='edit').length;
  const LC={
    hidden:{idle:{bg:'var(--p50)',co:'var(--p300)'},active:{bg:'var(--p900)',co:'#fff'},lb:'Hidden'},
    view:  {idle:{bg:'var(--p100)',co:'var(--p700)'},active:{bg:'var(--p700)',co:'#fff'},lb:'View'},
    edit:  {idle:{bg:'var(--p15)',co:'var(--p)'},   active:{bg:'var(--p)',    co:'#fff'},lb:'Edit'},
  };

  const cats=['Identity','Specs','Commercial','Ownership','Internal','Brokerage'];
  let frows='';
  cats.forEach(cat=>{
    const fields=YF.filter(f=>f.c===cat); if(!fields.length) return;
    frows+=`<div style="padding:5px 12px;background:var(--p50);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--p400);border-top:1px solid var(--p150);border-bottom:1px solid var(--p150)">${cat}</div>`;
    fields.forEach(f=>{
      const lv=fp[f.name]||'hidden';
      const pills=['hidden','view','edit'].map(opt=>{
        const on=lv===opt; const cfg=LC[opt];
        return `<span class="fp" onclick="setFL('${f.name}','${opt}')" style="background:${on?cfg.active.bg:cfg.idle.bg};color:${on?cfg.active.co:cfg.idle.co};${on?'outline:2px solid var(--p200);outline-offset:1px':''}">${cfg.lb}</span>`;
      }).join('');
      frows+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--p150)">
        <div style="flex:1;display:flex;align-items:center;gap:5px"><span style="font-size:13px">${f.name}</span>${sDot(f.s)}</div>
        <div style="display:flex;gap:3px">${pills}</div>
      </div>`;
    });
  });

  return `<div>
    <div style="display:flex;gap:7px;margin-bottom:14px">
      ${[['Hidden',hidden,'var(--p50)','var(--p400)','var(--p200)'],['View only',viewOnly,'var(--p100)','var(--p700)','var(--p300)'],['Editable',editable,'var(--p)','#fff','var(--p700)']].map(([l,n,bg,co,bd])=>`
        <div style="flex:1;padding:9px 12px;background:${bg};border-radius:8px;border:1px solid ${bd};display:flex;align-items:center;gap:8px">
          <span style="font-size:20px;font-weight:800;color:${co};line-height:1">${n}</span>
          <div><div style="font-size:11px;font-weight:500;color:${co}">${l}</div><div style="font-size:10px;color:${co};opacity:.7">${l==='Hidden'?'not visible':l==='View only'?'read-only':'read+write'}</div></div>
        </div>`).join('')}
    </div>
    <div class="card" style="overflow:hidden;padding:0">
      <div class="ch" style="background:var(--p25);justify-content:space-between">
        <div class="ct">Field Access — Yachts entity</div>
        <div style="font-size:11px;color:var(--g39)">Click pills to toggle</div>
      </div>
      <div style="overflow-y:auto;max-height:360px">${frows}</div>
    </div>
  </div>`;
}

/* Tab: Effective Access Preview */
function _rdPreview(role){
  // Show users with this role + their effective access summary
  const roleUsers=USERS.filter(u=>u.role===role);
  const perms=PM[role]||PM['Viewer'];
  const fields=FD[role]||FD['Viewer'];

  function cando(u){
    return[
      {on:true,  t:`View ${u.scope==='brand'?u.brand:u.scope==='authored'?'authored records':'all'} yachts`, via:'Scope'},
      {on:!!(perms['Yachts']?.Create), t:'Create yacht listings', via:'Role'},
      {on:!!(perms['Yachts']?.Edit),   t:'Edit yacht listings',   via:'Role'},
      {on:!!(perms['Yachts']?.Delete), t:'Delete yacht records',  via:'Role'},
      {on:!!(perms['Yachts']?.Export), t:'Export yacht data',     via:'Role'},
      {on:!!(perms['Yacht Lists']?.Share), t:'Share curated lists', via:'Role'},
      {on:fields['Owner Contact']!=='hidden', t:'See owner contact details', via:'Fields'},
      {on:fields['Commission Terms']!=='hidden', t:'See commission terms', via:'Fields'},
    ];
  }

  // Access source pipeline visual (Improvement 4)
  const sourcePipeline=`
    <div style="display:flex;align-items:center;gap:0;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      ${[
        {label:'Role',    val:role,       bg:'var(--p100)',co:'var(--p700)'},
        {label:'Scope',   val:'Per user', bg:'var(--p50)', co:'var(--p400)'},
        {label:'Fields',  val:`${Object.values(fields).filter(v=>v==='hidden').length} hidden`, bg:'var(--amberl)',co:'var(--amber)'},
      ].map((src,i)=>`
        <div style="display:flex;align-items:center;gap:6px">
          ${i>0?`<span style="color:var(--g75);font-size:14px;font-weight:300">+</span>`:''}
          <div style="padding:6px 12px;border-radius:7px;background:${src.bg};border:1px solid rgba(0,0,0,.06)">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:${src.co};opacity:.7">${src.label}</div>
            <div style="font-size:12px;font-weight:500;color:${src.co};margin-top:1px">${src.val}</div>
          </div>
        </div>`).join('')}
      <span style="color:var(--g75);font-size:14px;font-weight:300">=</span>
      <div style="padding:6px 12px;border-radius:7px;background:var(--greenl);border:1px solid rgba(43,150,103,.2)">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--green);opacity:.7">Effective</div>
        <div style="font-size:12px;font-weight:500;color:var(--green);margin-top:1px">Access profile</div>
      </div>
    </div>`;

  // Role-level capability table (like the image attached)
  const capRows=[
    {label:'View Yachts',        check:!!(perms['Yachts']?.View)},
    {label:'Edit Yachts',        check:!!(perms['Yachts']?.Edit)},
    {label:'Delete Yachts',      check:!!(perms['Yachts']?.Delete)},
    {label:'Export Data',        check:!!(perms['Yachts']?.Export)},
    {label:'Share Lists',        check:!!(perms['Yacht Lists']?.Share)},
    {label:'Send Emails',        check:!!(perms['Emails']?.Create)},
    {label:'View Sales History', check:!!(perms['Sales History']?.View)},
    {label:'See Owner Contact',  check:fields['Owner Contact']!=='hidden'},
    {label:'See Commission Terms',check:fields['Commission Terms']!=='hidden'},
    {label:'Manage Users',       check:role==='Admin'},
  ];

  const capTable=`<div class="card" style="overflow:hidden;padding:0;margin-bottom:14px">
    <div class="ch" style="background:var(--p25);justify-content:space-between">
      <div class="ct">Capability Summary — ${role}</div>
      <span style="font-size:11px;color:var(--g39)">${capRows.filter(r=>r.check).length}/${capRows.length} capabilities</span>
    </div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--p50);border-bottom:1px solid var(--p150)">
        <th style="padding:8px 14px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--g39);text-align:left">Capability</th>
        <th style="padding:8px 14px;text-align:center;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--g39)">${role}</th>
      </tr></thead>
      <tbody>
        ${capRows.map(row=>`<tr style="border-bottom:1px solid var(--p150)">
          <td style="padding:9px 14px;font-size:13px;color:var(--g11)">${row.label}</td>
          <td style="padding:9px 14px;text-align:center">
            <span style="display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:${row.check?'var(--greenl)':'var(--p50)'};color:${row.check?'var(--green)':'var(--g75)'}">${row.check?'✓':'✕'}</span>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  // Per-user effective access cards (Improvement 4 visual)
  const userCards=roleUsers.length>0 ? roleUsers.map(u=>{
    const cd=cando(u);
    const allowed=cd.filter(x=>x.on).length;
    const denied=cd.filter(x=>!x.on).length;
    const pct=Math.round((allowed/(allowed+denied))*100);
    return `<div class="card" style="padding:14px;margin-bottom:9px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        ${av(u.av,30)}
        <div style="flex:1">
          <div style="font-size:13px;font-weight:400;color:var(--g11)">${u.name}</div>
          <div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap">${scTag(u.scope)} <span style="font-size:11px;color:var(--g39)">${u.brand}</span></div>
        </div>
        <span class="tag ${u.status==='active'?'t-ok':'t-wn'}">${u.status}</span>
      </div>
      <!-- Access source pipeline per user (Improvement 4) -->
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:11px">
        <span style="padding:2px 8px;border-radius:999px;background:var(--p100);color:var(--p700);font-weight:500">Role: ${u.role}</span>
        <span style="color:var(--g75)">+</span>
        <span style="padding:2px 8px;border-radius:999px;background:var(--p50);color:var(--p400);font-weight:500">Scope: ${u.scope}</span>
        <span style="color:var(--g75)">+</span>
        <span style="padding:2px 8px;border-radius:999px;background:var(--amberl);color:var(--amber);font-weight:500">Fields: restricted</span>
      </div>
      <!-- Permission bar (Improvement 4 visual) -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <div style="flex:1;height:6px;border-radius:999px;background:var(--p100);overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--green);border-radius:999px;transition:width .3s"></div>
        </div>
        <span style="font-size:11px;color:var(--green);font-weight:500">${allowed} allowed</span>
        <span style="font-size:11px;color:var(--g75)">${denied} denied</span>
      </div>
      <!-- Brand access dots -->
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${BRANDS.slice(0,5).map(b=>{
          const canSee=(u.scope==='all')||(u.scope==='brand'&&u.brand===b)||(u.scope==='cross-brand'&&(u.brand.includes(b.split(' ')[0])))||(u.scope==='authored'&&u.brand===b);
          return `<span style="font-size:10.5px;padding:2px 7px;border-radius:999px;background:${canSee?'var(--greenl)':'var(--p50)'};color:${canSee?'var(--green)':'var(--g75)'};display:flex;align-items:center;gap:3px">
            <span style="font-size:9px">${canSee?'✓':'✕'}</span>${b.split(' ')[0]}
          </span>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')
  : `<div class="card" style="padding:16px;text-align:center"><div style="font-size:13px;color:var(--g75)">No users currently assigned to ${role}</div></div>`;

  return `<div>
    ${sourcePipeline}
    <div class="g2" style="gap:18px">
      <div>${capTable}</div>
      <div>
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g75);margin-bottom:9px">Users on this role (${roleUsers.length})</div>
        ${userCards}
      </div>
    </div>
  </div>`;
}

function togglePerm(el,a){
  const k=el+':'+a;

  const cur=S.permOv[k]!==undefined?S.permOv[k]:!!(base[el]&&base[el][a]);

  renderPage();
}

/* ── EFFECTIVE ACCESS — with visual improvements (Improvement 4) ── */
function renderEffective(){
  const VB={"Role":{bg:'var(--p100)',co:'var(--p700)'},"Scope":{bg:'var(--p50)',co:'var(--p400)'},"Fields":{bg:'var(--amberl)',co:'var(--amber)'},"Field visibility":{bg:'var(--p15)',co:'var(--p)'}};

  function cando(u){
    const perms=PM[u.role]||PM['Viewer'];
    const fields=FD[u.role]||FD['Viewer'];
    return[
      {on:true,  t:`View ${u.scope==='brand'?u.brand:u.scope==='authored'?'authored records':'all'} yachts`, via:'Scope', cat:'Data visibility'},
      {on:!!(perms['Yachts']?.Create), t:'Create new yacht listings', via:'Role',   cat:'Yachts'},
      {on:!!(perms['Yachts']?.Edit),   t:'Edit yacht listings',       via:'Role',   cat:'Yachts'},
      {on:!!(perms['Yachts']?.Delete), t:'Delete yacht records',      via:'Role',   cat:'Yachts'},
      {on:!!(perms['Yachts']?.Export), t:'Export yacht data',         via:'Role',   cat:'Yachts'},
      {on:!!(perms['Yacht Lists']?.Share), t:'Share curated lists',   via:'Role',   cat:'Lists'},
      {on:!!(perms['Emails']?.Create), t:'Send emails via platform',  via:'Role',   cat:'Emails'},
      {on:!!(perms['Sales History']?.View), t:'View sales history',   via:'Role',   cat:'Sales'},
      {on:fields['Owner Contact']!=='hidden',     t:'See owner contact details', via:'Field visibility', cat:'Sensitive fields'},
      {on:fields['Commission Terms']!=='hidden',  t:'See commission & fee terms',via:'Field visibility', cat:'Sensitive fields'},
      {on:u.role==='Admin', t:'Manage platform users and roles', via:'Role', cat:'Administration'},
    ];
  }

  const rows=USERS.map((u,ui)=>{
    const isOpen=S.effExp===u.id;
    const cd=cando(u);
    const allowed=cd.filter(c=>c.on).length;
    const denied=cd.filter(c=>!c.on).length;
    const pct=Math.round((allowed/(allowed+denied))*100);
    const cats=[...new Set(cd.map(c=>c.cat))];

    // Access source pipeline (Improvement 4)
    const pipeline=`<div style="display:flex;align-items:center;gap:5px;margin-bottom:10px;flex-wrap:wrap">
      <span style="padding:3px 9px;border-radius:999px;background:var(--p100);color:var(--p700);font-size:11px;font-weight:500">Role: ${u.role}</span>
      <span style="font-size:12px;color:var(--g75)">→</span>
      <span style="padding:3px 9px;border-radius:999px;background:var(--p50);color:var(--p400);font-size:11px;font-weight:500">Scope: ${u.scope==='cross-brand'?'Cross-brand':u.scope.charAt(0).toUpperCase()+u.scope.slice(1)}</span>
      <span style="font-size:12px;color:var(--g75)">→</span>
      <span style="padding:3px 9px;border-radius:999px;background:var(--amberl);color:var(--amber);font-size:11px;font-weight:500">Field Access: ${Object.values(FD[u.role]||{}).filter(v=>v==='hidden').length} hidden</span>
      <span style="font-size:12px;color:var(--g75)">→</span>
      <span style="padding:3px 9px;border-radius:999px;background:var(--greenl);color:var(--green);font-size:11px;font-weight:500">${allowed} allowed / ${denied} denied</span>
    </div>`;

    // Brand access dots (Improvement 4)
    const brandDots=BRANDS.slice(0,5).map(b=>{
      const canSee=(u.scope==='all')||(u.scope==='brand'&&u.brand.includes(b.split(' ')[0]))||(u.scope==='cross-brand'&&u.brand.includes(b.split(' ')[0]));
      return `<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:${canSee?'var(--greenl)':'var(--p50)'};color:${canSee?'var(--green)':'var(--g75)'};display:inline-flex;align-items:center;gap:3px">
        <span>${canSee?'✓':'✕'}</span>${b.split(' ')[0]}
      </span>`;
    }).join('');

    const grid=cats.map(cat=>{
      const items=cd.filter(c=>c.cat===cat);
      return `<div style="background:#fff;border-radius:7px;border:1px solid var(--p150);overflow:hidden">
        <div style="padding:6px 11px;background:var(--p50);border-bottom:1px solid var(--p150);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--p400)">${cat}</div>
        ${items.map((c,ci)=>`<div style="display:flex;align-items:center;gap:7px;padding:7px 11px;border-bottom:${ci<items.length-1?'1px solid var(--p150)':'none'}">
          <div style="width:15px;height:15px;border-radius:50%;background:${c.on?'var(--greenl)':'var(--p50)'};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${c.on?'var(--green)':'var(--p300)'};flex-shrink:0">${c.on?'✓':'–'}</div>
          <span style="flex:1;font-size:12px;color:${c.on?'var(--g11)':'var(--g75)'};line-height:1.3">${c.t}</span>
          ${c.on?`<span style="font-size:10px;padding:1px 6px;border-radius:999px;background:${VB[c.via]?.bg||'var(--p50)'};color:${VB[c.via]?.co||'var(--p400)'};font-weight:500;white-space:nowrap">${c.via}</span>`:''}
        </div>`).join('')}
      </div>`;
    }).join('');

    return `<div style="border-bottom:${ui<USERS.length-1?'1px solid var(--p150)':'none'}">
      <div class="er${isOpen?' open':''}" onclick="S.effExp=S.effExp===${u.id}?null:${u.id};renderPage()">
        <div style="display:flex;align-items:center;gap:9px">
          ${av(u.av,isOpen?30:28)}
          <div style="min-width:0">
            <div style="font-size:13px;font-weight:400;color:var(--g11)">${u.name}</div>
            <div style="font-size:11px;color:var(--g75)">${u.email}</div>
          </div>
          ${!isOpen?`
            <div style="margin-left:8px;display:flex;flex-direction:column;gap:3px">
              <div style="display:flex;align-items:center;gap:5px">
                <div style="width:60px;height:4px;border-radius:999px;background:var(--p100);overflow:hidden">
                  <div style="height:100%;width:${pct}%;background:var(--green);border-radius:999px"></div>
                </div>
                <span style="font-size:10.5px;color:var(--green);font-weight:500">${allowed}</span>
                <span style="font-size:10.5px;color:var(--g75)">${denied}</span>
              </div>
            </div>`:''}
          <div style="margin-left:auto;color:var(--g75);font-size:10px;transform:${isOpen?'rotate(180deg)':'rotate(0)'};transition:transform .2s;flex-shrink:0">▾</div>
        </div>
        <div>${roleTag(u.role)}</div>
        <div>${scTag(u.scope)}</div>
        <div style="font-size:12px;color:var(--g39);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.brand.split(' ')[0]}</div>
        <div><span class="tag ${u.status==='active'?'t-ok':'t-wn'}">${u.status}</span></div>
      </div>
      <div class="ep${isOpen?'':' hidden'}">
        <div style="padding:10px 13px;background:#fff;border-radius:7px;border:1px solid var(--p150);margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            ${av(u.av,34)}
            <div style="flex:1">
              <div style="font-weight:500;font-size:13.5px">${u.name}</div>
              <div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap">${roleTag(u.role)} ${scTag(u.scope)} <span style="font-size:11px;color:var(--g39)">${u.brand}</span></div>
            </div>
            <div style="display:flex;gap:14px;flex-shrink:0">
              <div style="text-align:center"><div style="font-size:18px;font-weight:800;color:var(--green);line-height:1">${allowed}</div><div style="font-size:10px;color:var(--g75);margin-top:1px">Allowed</div></div>
              <div style="text-align:center"><div style="font-size:18px;font-weight:800;color:var(--p300);line-height:1">${denied}</div><div style="font-size:10px;color:var(--g75);margin-top:1px">Denied</div></div>
            </div>
          </div>
          ${pipeline}
          <div style="display:flex;gap:5px;flex-wrap:wrap">${brandDots}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px">${grid}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="pg">
    <div class="pg-hd"><div><div class="pg-t">Effective Access</div><div class="pg-s">Combined result of role + scope + field visibility — what each user can actually do</div></div></div>
    <div class="notice n-i">${ico('info',13,'#1e3a8a')}<span>Each row shows the <strong>Access Source Pipeline</strong>: Role → Scope → Field Access → Effective result. Expand any user for the full breakdown.</span></div>
    <div class="card" style="overflow:hidden;padding:0">
      <div style="display:grid;grid-template-columns:1fr 120px 120px 86px 76px;padding:8px 13px;background:var(--p50);border-bottom:2px solid var(--p150)">
        ${['User','Role','Scope','Brand','Status'].map(h=>`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g39)">${h}</div>`).join('')}
      </div>
      ${rows}
    </div>
  </div>`;
}

/* ── ROLE COMPARISON PANEL (Improvement 3) — modal drawer ── */
function renderComparePanel(){
  const roles=S.compareRoles;
  const ALL_ROLES=ROLES.map(r=>r.name);

  const CAPS=[
    {label:'View Yachts',         fn:(r)=>!!(PM[r]?.['Yachts']?.View)},
    {label:'Create Yachts',       fn:(r)=>!!(PM[r]?.['Yachts']?.Create)},
    {label:'Edit Yachts',         fn:(r)=>!!(PM[r]?.['Yachts']?.Edit)},
    {label:'Delete Yachts',       fn:(r)=>!!(PM[r]?.['Yachts']?.Delete)},
    {label:'Export Data',         fn:(r)=>!!(PM[r]?.['Yachts']?.Export)},
    {label:'Share Lists',         fn:(r)=>!!(PM[r]?.['Yacht Lists']?.Share)},
    {label:'Send Emails',         fn:(r)=>!!(PM[r]?.['Emails']?.Create)},
    {label:'View Sales History',  fn:(r)=>!!(PM[r]?.['Sales History']?.View)},
    {label:'Access Charter Info', fn:(r)=>!!(PM[r]?.['Charter Info']?.View)},
    {label:'See Owner Contact',   fn:(r)=>(FD[r]?.['Owner Contact']||'hidden')!=='hidden'},
    {label:'See Price History',   fn:(r)=>(FD[r]?.['Price History']||'hidden')!=='hidden'},
    {label:'See Commission',      fn:(r)=>(FD[r]?.['Commission Terms']||'hidden')!=='hidden'},
    {label:'Manage Users',        fn:(r)=>r==='Admin'},
    {label:'Audit Log Access',    fn:(r)=>r==='Admin'},
  ];

  const scopeDefault={Admin:'all',Broker:'brand','Listing Manager':'brand',Analyst:'cross-brand','Support Agent':'brand',Viewer:'authored'};

  const colHeaders=roles.map(r=>`<th style="padding:10px 14px;text-align:center;background:var(--p25);border-left:1px solid var(--p150);border-bottom:2px solid var(--p150);min-width:100px">
    <div>${roleTag(r)}</div>
    <div style="font-size:10px;color:var(--g75);margin-top:3px">${ROLES.find(x=>x.name===r)?.users||0} users</div>
  </th>`).join('');

  // Group caps into sections
  const sections=[
    {label:'Yacht Actions', caps:CAPS.slice(0,6)},
    {label:'Communication & Export', caps:CAPS.slice(6,9)},
    {label:'Sensitive Fields', caps:CAPS.slice(9,12)},
    {label:'Administration', caps:CAPS.slice(12)},
  ];

  let tableRows='';
  sections.forEach(sec=>{
    tableRows+=`<tr><td colspan="${roles.length+1}" style="padding:7px 14px;background:var(--p50);border-top:1px solid var(--p150);border-bottom:1px solid var(--p150)">
      <span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--g39)">${sec.label}</span>
    </td></tr>`;
    sec.caps.forEach(cap=>{
      tableRows+=`<tr style="border-bottom:1px solid var(--p150)">
        <td style="padding:8px 14px;font-size:13px;color:var(--g11)">${cap.label}</td>
        ${roles.map(r=>{
          const has=cap.fn(r);
          return `<td style="padding:8px 14px;text-align:center;border-left:1px solid var(--p150)">
            <span style="display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:${has?'var(--greenl)':'var(--redl)'};color:${has?'var(--green)':'var(--red)'}">
              ${has?'✓':'✕'}
            </span>
          </td>`;
        }).join('')}
      </tr>`;
    });
  });

  // Scope row
  tableRows+=`<tr><td colspan="${roles.length+1}" style="padding:7px 14px;background:var(--p50);border-top:1px solid var(--p150);border-bottom:1px solid var(--p150)"><span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--g39)">Data Scope</span></td></tr>`;
  tableRows+=`<tr style="border-bottom:1px solid var(--p150)"><td style="padding:8px 14px;font-size:13px;color:var(--g11)">Default Scope Level</td>
    ${roles.map(r=>`<td style="padding:8px 14px;text-align:center;border-left:1px solid var(--p150)">${scTag(scopeDefault[r]||'brand')}</td>`).join('')}
  </tr>`;

  const roleSelects=roles.map((r,i)=>`
    <select class="sel" style="height:28px;font-size:12px" onchange="S.compareRoles[${i}]=this.value;renderPage()">
      ${ALL_ROLES.map(rn=>`<option value="${rn}"${rn===r?' selected':''}>${rn}</option>`).join('')}
    </select>`).join('');

  return `
    <!-- Compare panel overlay -->

function renderBySB(){
  const sb=document.getElementById('by-sb'); if(!sb) return;
  let h='';
  BY_NAV.forEach(it=>{
    const on=S.byPage===it.id||S.byPage.startsWith(it.id+'-');
    const grpOpen=S.byGrp===it.id;
    const ic=on?'var(--by-teal)':'var(--by-mid)';
    h+=`<div class="by-si${on?' on':''}" onclick="${it.subs.length?`S.byGrp=S.byGrp==='${it.id}'?null:'${it.id}';renderBySB()`:`byNav('${it.id}')`}">
      ${byIco(it.ic,17,ic)}<span style="flex:1">${it.lb}</span>
      ${it.subs.length?`<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="${ic}" stroke-width="1.6" stroke-linecap="round" style="flex-shrink:0;transition:transform .2s;transform:${grpOpen?'rotate(180deg)':'rotate(0)'}"><polyline points="2.5,4.5 6.5,8.5 10.5,4.5"/></svg>`:''}
    </div>`;
    if(it.subs.length&&grpOpen){
      // vertical line container matching reference screenshot
      h+=`<div style="margin:2px 0 4px;padding-left:22px;border-left:none">`;
      // The reference shows a vertical line on the left of sub-items
      h+=`<div style="margin-left:14px;border-left:2px solid var(--by-border);padding-left:0">`;
      it.subs.forEach(s=>{
        const son=S.byPage===s.id;
        h+=`<div class="by-su${son?' on':''}" onclick="byNav('${s.id}')" style="margin:0 8px 0 0;padding-left:${son?'10':'12'}px;${son?'border-left:2px solid var(--by-teal);margin-left:-2px':''}">
          <span>${s.lb}</span>
        </div>`;
      });
      h+=`</div></div>`;
    }
  });
  // Settings divider
  h+=`<div style="height:1px;background:var(--by-border);margin:10px 14px"></div>`;
  BY_SETT.forEach(it=>{
    const on=S.byPage===it.id; const ic=on?'var(--by-teal)':'var(--by-mid)';
    h+=`<div class="by-si${on?' on':''}" onclick="byNav('${it.id}')">${byIco(it.ic,17,ic)}<span>${it.lb}</span></div>`;
  });
  // Collapse button at bottom matching reference
  h+=`<div style="flex:1"></div>
  <div style="padding:10px 12px">
    <button onclick="" style="width:40px;height:40px;background:#fff;border:1px solid var(--by-border);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--by-mid)" stroke-width="1.5" stroke-linecap="round"><polyline points="10,4 6,8 10,12"/></svg>
    </button>
  </div>`;
  sb.innerHTML=h;
}
